[package]
name = "ccbridge"
version = "0.10.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/akaryc1b/CCBridge"
description = "macOS SSH bridge from Codex MCP to remote Claude Code"

[features]
default = ["desktop"]
bridge = ["dep:russh"]
desktop = ["bridge", "dep:eframe", "dep:shadcn-egui", "dep:rfd", "dep:egui_commonmark"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.54.1", features = ["full"] }
russh = { version = "0.64.1", optional = true, default-features = false, features = ["ring"] }
rmcp = { version = "0.8", features = ["server", "transport-io"] }
schemars = "1"
url = "2"
toml_edit = "0.22"
shadcn-egui = { version = "=0.6.0", optional = true }
egui_commonmark = { version = "=0.23.0", default-features = false, optional = true }
rfd = { version = "0.15", optional = true }
libc = "0.2"
eframe = { version = "0.34.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target."cfg(windows)".dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "job-object", "creation-flags"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }
