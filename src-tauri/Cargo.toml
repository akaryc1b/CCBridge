[package]
name = "ccbridge-desktop"
version = "0.5.1"
edition = "2024"

[[bin]]
name = "ccbridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ccbridge = { path = "..", default-features = false, features = ["bridge"] }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
strip = true
lto = "thin"
