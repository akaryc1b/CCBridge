name: Windows native remote
on:
  push:
    branches: [codex/windows-native-remote]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_unix_regression:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-remote-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-runner:
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt; rustup default 1.93.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: windows-native-runner-rust193-v1
          cache-on-failure: true
      - name: Compile native Runner
        id: native-build
        run: cargo build --locked --release --no-default-features
      - name: Development candidate for parallel Mac integration
        if: github.ref == 'refs/heads/codex/windows-native-remote'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-remote-development-candidate
          path: target/release/ccbridge.exe
          retention-days: 3
      - name: Compile all unit tests
        run: cargo test --locked --release --no-default-features --no-run
      - name: Platform tests
        run: |
          cargo test --locked --release --no-default-features remote_platform
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release --no-default-features native_fs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CCBRIDGE_TEST_BIN=(Resolve-Path target/release/ccbridge.exe).Path
          cargo test --locked --release --no-default-features windows_bootstrap
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native Windows acceptance (fixture, no Claude account)
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          rustc tests/windows-claude-fixture.rs -o "$env:RUNNER_TEMP\ccbridge-claude-fixture.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/windows-remote-smoke.py target/release/ccbridge.exe "$env:RUNNER_TEMP\ccbridge-claude-fixture.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare versioned Windows Runner payload
        run: New-Item -ItemType Directory -Force dist | Out-Null; Copy-Item target/release/ccbridge.exe dist/ccbridge-windows-x86_64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-native-runner
          path: dist/ccbridge-windows-x86_64.exe
          retention-days: 14
  unix-regression:
    if: ${{ !inputs.skip_unix_regression }}
    strategy:
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt && rustup default 1.93.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: windows-remote-${{ matrix.os }}-rust193-v1
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features
      - run: cargo check --locked --no-default-features --features bridge
      - run: cargo build --locked --no-default-features --features bridge
      - name: Encrypted SSH and MCP regression
        env:
          CCBRIDGE_TEST_BIN: ${{ github.workspace }}/target/debug/ccbridge
        run: cargo test --locked --no-default-features --features bridge encrypted_ssh_runner_and_mcp_acceptance -- --test-threads=1
      - name: Detached worker regression
        run: sh tests/linux-smoke.sh "$PWD/target/debug/ccbridge"
