name: Sync Codeup

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check credentials
        env:
          CODEUP_USERNAME: ${{ secrets.CODEUP_USERNAME }}
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
        run: |
          if [ -z "$CODEUP_USERNAME" ] || [ -z "$CODEUP_TOKEN" ]; then
            echo '::error::Configure repository secrets CODEUP_USERNAME and CODEUP_TOKEN with Codeup push access.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch current GitHub branches and tags
        run: |
          git fetch --prune origin '+refs/heads/*:refs/codeup-source/heads/*' '+refs/tags/*:refs/codeup-source/tags/*'
      - name: Push branches and tags to Codeup
        env:
          CODEUP_USERNAME: ${{ secrets.CODEUP_USERNAME }}
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          cat > "$temp_dir/askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$CODEUP_USERNAME" ;;
            *Password*) printf '%s\n' "$CODEUP_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$temp_dir/askpass"
          export GIT_ASKPASS="$temp_dir/askpass"
          refs=()
          while IFS= read -r ref; do
            target="refs/${ref#refs/codeup-source/}"
            refs+=("$ref:$target")
          done < <(git for-each-ref --format='%(refname)' refs/codeup-source/heads/ refs/codeup-source/tags/)
          if [ "${#refs[@]}" -eq 0 ]; then
            echo '::error::No source branches or tags found.'
            exit 1
          fi
          git -c credential.helper= push --atomic \
            https://codeup.aliyun.com/62a4de12a61bf880d4caa81e/CCBridge.git "${refs[@]}"
          printf 'Synced %s branches/tags to Codeup.\n' "${#refs[@]}" >> "$GITHUB_STEP_SUMMARY"
