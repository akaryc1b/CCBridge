name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt && rustup default 1.93.0
      - name: Rust dependency cache (Linux)
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-x86_64-rust193-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache evidence
        run: echo 'Linux Rust exact cache hit = ${{ steps.rust-cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Incremental update manifest tests
        run: python3 tests/update-manifest-test.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Security policy tests
        run: python3 tests/security-audit-test.py
      - name: Audit shipped Rust dependency graphs
        run: python3 scripts/security-audit.py --output security-audit.json
      - name: pnpm for dependency audit
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - name: Audit frontend production dependencies
        run: pnpm --dir ui audit --prod --audit-level=low
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Build Runner
        run: cargo build --locked --release --no-default-features
      - name: Runner tests
        run: cargo test --locked --no-default-features
      - name: Detached worker smoke
        run: sh tests/linux-smoke.sh "$PWD/target/release/ccbridge"
      - name: Prepare Runner
        run: mkdir -p dist && cp target/release/ccbridge dist/ccbridge-linux-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-runner
          path: dist/ccbridge-linux-x86_64
          retention-days: 14

  databases:
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        engine: [mysql, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-runner
          path: dist
      - name: Install tested database MCP into temporary test directory
        run: node -e 'if(Number(process.versions.node.split(".")[0])<20)process.exit(1)' && npm install --prefix "$RUNNER_TEMP/udb" --ignore-scripts universal-db-mcp@2.14.0
      - name: Multi-project database acceptance
        env:
          ENGINE: ${{ matrix.engine }}
          CCBRIDGE_TEST_BIN: ${{ github.workspace }}/dist/ccbridge-linux-x86_64
          UDB_PACKAGE_ROOT: ${{ runner.temp }}/udb/node_modules/universal-db-mcp
        run: chmod 700 "$CCBRIDGE_TEST_BIN" && python3 tests/database-acceptance.py "$ENGINE"

  macos_arm64:
    needs: linux
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt && rustup default 1.93.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-runner
          path: dist
      - name: Rust dependency cache (arm64)
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos15-arm64-rust193-v1
          workspaces: |
            . -> target
            src-tauri -> target
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
          run_install: false
      - name: Node and pnpm download cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Cache evidence
        run: echo 'arm64 Rust exact cache hit = ${{ steps.rust-cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Build compatibility CLI and integration fixture
        run: cargo build --locked --release --no-default-features --features bridge
      - name: Full SSH and MCP integration tests
        env:
          CCBRIDGE_TEST_BIN: ${{ github.workspace }}/target/release/ccbridge
        run: cargo test --locked
      - name: Frontend typecheck and production build
        run: pnpm --dir ui install --frozen-lockfile && pnpm --dir ui lint:ui && pnpm --dir ui test && pnpm --dir ui build
      - name: Tauri release build and cache warmup
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: cd src-tauri && ../ui/node_modules/.bin/tauri build --no-bundle
      - name: Package signed updater
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: chmod 700 dist/ccbridge-linux-x86_64 && sh scripts/package-tauri.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: |
            dist-tauri/*.dmg
            dist-tauri/*.zip
            dist-tauri/*.tar.gz
            dist-tauri/*.tar.gz.sig
            dist-tauri/latest-darwin-*.json
          if-no-files-found: ignore
          retention-days: 14

  macos_x86_64:
    needs: linux
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check runner architecture
        run: test "$(uname -m)" = "x86_64"
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt && rustup default 1.93.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-runner
          path: dist
      - name: Rust dependency cache (x86_64)
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos15-x86_64-rust193-v1
          workspaces: |
            . -> target
            src-tauri -> target
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
          run_install: false
      - name: Node and pnpm download cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Cache evidence
        run: echo 'x86_64 Rust exact cache hit = ${{ steps.rust-cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Build compatibility CLI and integration fixture
        run: cargo build --locked --release --no-default-features --features bridge
      - name: Full SSH and MCP integration tests
        env:
          CCBRIDGE_TEST_BIN: ${{ github.workspace }}/target/release/ccbridge
        run: cargo test --locked
      - name: Frontend typecheck and production build
        run: pnpm --dir ui install --frozen-lockfile && pnpm --dir ui lint:ui && pnpm --dir ui test && pnpm --dir ui build
      - name: Tauri release build and cache warmup
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: cd src-tauri && ../ui/node_modules/.bin/tauri build --no-bundle
      - name: Package signed updater
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: chmod 700 dist/ccbridge-linux-x86_64 && sh scripts/package-tauri.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-x86_64
          path: |
            dist-tauri/*.dmg
            dist-tauri/*.zip
            dist-tauri/*.tar.gz
            dist-tauri/*.tar.gz.sig
            dist-tauri/latest-darwin-*.json
          if-no-files-found: ignore
          retention-days: 14

  release_arm64:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos_arm64, databases]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-arm64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-runner
          path: release
      - name: Publish available architecture
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: sh scripts/publish-architecture.sh release

  release_x86_64:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos_x86_64, databases, release_arm64]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-x86_64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-runner
          path: release
      - name: Publish available architecture
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: sh scripts/publish-architecture.sh release
